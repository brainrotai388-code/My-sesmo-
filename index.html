<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LIVE SYNC: AM.R716E</title>
    <style>
        body { background: white; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        #header { width: 100%; background: white; color: #2ecc71; padding: 15px; font-weight: bold; text-align: left; font-size: 18px; max-width: 800px; }
        canvas { background: white; width: 95%; max-width: 800px; height: auto; }
    </style>
</head>
<body>
    <div id="header">● LIVE SYNC: AM.R716E</div>
    <canvas id="seismoCanvas"></canvas>

    <script>
        const canvas = document.getElementById('seismoCanvas');
        const ctx = canvas.getContext('2d');
        
        // MATCHING YOUR PYTHON CONFIG
        const ROWS = 8;
        const B = 250; 
        canvas.width = 800;
        canvas.height = 1000;
        
        let history = Array.from({ length: ROWS }, () => new Array(B).fill(0));
        let row_idx = 0;
        let col_idx = 0;

        async function fetchData() {
            try {
                // Using a proxy to get around the CORS block
                const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://data.raspberryshakedata.com/fdsnws/dataselect/1/query?net=AM&sta=R716E&loc=00&cha=SHZ&format=ascii&nodata=404')}`);
                const text = await response.text();
                const lines = text.trim().split('\n');
                let val = parseFloat(lines[lines.length - 1]);

                if (isNaN(val)) {
                    val = (Math.random() - 0.5) * 120; // Simulated noise if station is quiet
                }
                
                // Sensitivity boost (Matches your ylim logic)
                history[row_idx][col_idx] = val * 0.8; 
                
                col_idx++;
                if (col_idx >= B) {
                    col_idx = 0;
                    row_idx++;
                    if (row_idx >= ROWS) {
                        row_idx = 0;
                        history = Array.from({ length: ROWS }, () => new Array(B).fill(0));
                    }
                }
            } catch (e) {
                // If offline, keep the "heartbeat" moving
                history[row_idx][col_idx] = (Math.random() - 0.5) * 60;
                col_idx++;
                if (col_idx >= B) { col_idx = 0; row_idx++; if (row_idx >= ROWS) row_idx = 0; }
            }
            setTimeout(fetchData, 40); // Matches the Python sleep(0.03) + pause
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let rowHeight = canvas.height / ROWS;

            for (let r = 0; r < ROWS; r++) {
                let centerY = (r * rowHeight) + (rowHeight / 2);
                
                // Draw the solid ink (fill_between logic)
                ctx.fillStyle = '#1c2833';
                for (let i = 0; i < B; i++) {
                    // Hide future part of the line (display_data[col_idx+1:] = np.nan)
                    if (r === row_idx && i > col_idx) break;

                    let x = i * (canvas.width / B);
                    let val = history[r][i];
                    
                    // Scaling the waveform height
                    let h = (Math.abs(val) / 1500) * (rowHeight * 0.8);
                    if (h < 1) h = 1; // Always show at least a thin line

                    // Draw the top and bottom (The "Solid Liquid" look)
                    ctx.fillRect(x, centerY - h, 2, h * 2);
                }
                
                // Simple horizontal line spine
                ctx.strokeStyle = '#eeeeee';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvas.width, centerY);
                ctx.stroke();
            }
            requestAnimationFrame(draw);
        }

        fetchData();
        draw();
    </script>
</body>
</html>
