<!DOCTYPE html>
<html>
<head>
    <title>PH-EEW | MONITOR STABLE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        #map { position: absolute; width: 100%; height: 100%; z-index: 1; background: #0b1621; }
        
        /* ADJUSTED: Brightened map and fixed contrast for visibility */
        .leaflet-layer { 
            filter: invert(100%) hue-rotate(180deg) brightness(1.2) contrast(0.8); 
        }

        #ui-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; pointer-events: none; border: 2px solid #00ffcc; box-sizing: border-box; }
        #top-bar { background: rgba(0, 0, 0, 0.9); color: #00ffcc; padding: 12px; border-bottom: 2px solid #00ffcc; display: flex; justify-content: space-between; pointer-events: auto; }
        
        #audio-btn { background: #00ffcc; color: black; border: none; padding: 5px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* Station Pulse Animation */
        .station-dot {
            background: #00ffcc;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #00ffcc;
            animation: station-pulse 2s infinite;
        }
        @keyframes station-pulse {
            0% { box-shadow: 0 0 0px #00ffcc; }
            50% { box-shadow: 0 0 15px #00ffcc; }
            100% { box-shadow: 0 0 0px #00ffcc; }
        }

        /* Epicenter Star */
        .epicenter-star { color: #ff0000; font-size: 50px; text-shadow: 0 0 20px red; position: absolute; transform: translate(-50%, -50%); animation: flash 0.4s infinite; z-index: 2000; }
        @keyframes flash { 0% { scale: 1.2; } 50% { scale: 0.8; } 100% { scale: 1.2; } }

        #alert-panel { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(220, 0, 0, 0.95); color: white; padding: 30px; 
            border: 4px solid white; display: none; z-index: 5000; text-align: center;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="ui-frame">
    <div id="top-bar">
        <span>● EARTHQUAKE VIEWER WEB | STABLE</span>
        <button id="audio-btn" onclick="initAudio()">ENABLE AUDIO</button>
    </div>
    <div id="alert-panel">
        <h1 style="margin:0;">EARTHQUAKE ALERT</h1>
        <p>STRONG SHAKING EXPECTED</p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Station Data
    const stations = [
        { id: "R716E", lat: 14.601, lng: 121.033 }, // San Juan
        { id: "R4433", lat: 13.756, lng: 121.058 }, // Batangas
        { id: "R2627", lat: 18.196, lng: 120.592 }, // Laoag
        { id: "R6D50", lat: 10.315, lng: 123.885 }, // Cebu
        { id: "RE8A8", lat: 8.454, lng: 124.631 }   // CDO
    ];

    // Add Pulsing Dots for each station
    stations.forEach(s => {
        const dotIcon = L.divIcon({
            className: 'station-dot',
            iconSize: [12, 12],
            iconAnchor: [6, 6]
        });
        L.marker([s.lat, s.lng], { icon: dotIcon }).addTo(map).bindTooltip(s.id, { permanent: false });
    });

    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('audio-btn').innerText = "AUDIO ON";
        document.getElementById('audio-btn').style.background = "#444";
    }

    function playChime() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [0, 0.5, 1.0].forEach(d => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.frequency.setValueAtTime(960, now + d);
            g.gain.setValueAtTime(0.4, now + d);
            g.gain.exponentialRampToValueAtTime(0.01, now + d + 0.4);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(now + d); osc.stop(now + d + 0.4);
        });
    }

        } catch (e) {}
        setTimeout(stream, 1000);
    }
