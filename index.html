<!DOCTYPE html>
<html>
<head>
    <title>PH-EEW | SHAKENET LIVE</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
        #map { position: absolute; width: 100%; height: 100%; filter: grayscale(1) invert(1) brightness(0.4); z-index: 1; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; border: 2px solid #00ffcc; }
        #header { background: rgba(0,0,0,0.9); color: #00ffcc; padding: 12px; border-bottom: 2px solid #00ffcc; }
        
        /* Epicenter Star */
        .epicenter-star { color: #ff0000; font-size: 55px; text-shadow: 0 0 20px red; transform: translate(-50%, -50%); animation: flash 0.4s infinite; }
        @keyframes flash { 0% { scale: 1.2; opacity: 1; } 50% { scale: 0.8; opacity: 0.4; } 100% { scale: 1.2; opacity: 1; } }
        
        #data-log { position: absolute; bottom: 10px; left: 10px; color: #00ffcc; font-size: 10px; background: rgba(0,0,0,0.7); padding: 5px; }
    </style>
</head>
<body>

<div id="map"></div>
<script async src="https://maps.googleapis.com/maps/api/js?key=DEVELOPMENT_ONLY&callback=initMap"></script>

<div id="ui">
    <div id="header">● PH-REQV | SHAKENET CONNECTED | STATION: AM.R716E</div>
    <div id="data-log">FETCHING REAL-TIME DATA...</div>
</div>

<script>
    let map;
    let lastValue = 0;
    const MY_STATION = "R716E";

    // 1. SHAKENET LIVE CONNECTION
    async function fetchLiveSeismic() {
        const proxy = "https://api.allorigins.win/raw?url=";
        const target = `https://data.raspberryshakedata.com/fdsnws/dataselect/1/query?net=AM&sta=${MY_STATION}&loc=00&cha=SHZ&format=ascii&nodata=404`;
        
        try {
            const response = await fetch(proxy + encodeURIComponent(target));
            const text = await response.text();
            const lines = text.trim().split('\n');
            const newestVal = parseFloat(lines[lines.length - 1]);
            
            if (!isNaN(newestVal)) {
                lastValue = newestVal;
                document.getElementById('data-log').innerText = `LIVE STREAM: AM.${MY_STATION} | VAL: ${newestVal.toFixed(0)}`;
                
                // TRIGGER LOGIC: If a sudden spike > 5000 is detected
                if (Math.abs(newestVal) > 5000) {
                    triggerAlert(14.601, 121.033); // Trigger at San Juan coords
                }
            }
        } catch (e) {
            document.getElementById('data-log').innerText = "CONNECTION ERROR: SHAKENET TIMEOUT";
        }
        setTimeout(fetchLiveSeismic, 500); // Check every half second
    }

    // 2. MAP & VISUALS
    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 7, center: { lat: 12.879, lng: 121.774 },
            disableDefaultUI: true, styles: [{ "stylers": [{ "invert_lightness": true }] }]
        });
        fetchLiveSeismic();
    }

    function triggerAlert(lat, lng) {
        // Show Star
        const star = new google.maps.OverlayView();
        star.onAdd = function() {
            const div = document.createElement('div');
            div.className = 'epicenter-star';
            div.innerHTML = '★';
            div.style.position = 'absolute';
            this.getPanes().overlayLayer.appendChild(div);
            this.div = div;
        };
        star.draw = function() {
            const pos = this.getProjection().fromLatLngToDivPixel(new google.maps.LatLng(lat, lng));
            this.div.style.left = pos.x + 'px';
            this.div.style.top = pos.y + 'px';
        };
        star.setMap(map);
        setTimeout(() => star.setMap(null), 10000);

        // Expand P-Wave
        let r = 0;
        const circle = new google.maps.Circle({
            map: map, center: { lat: lat, lng: lng },
            strokeColor: "#00ffcc", strokeOpacity: 0.8, strokeWeight: 3,
            fillColor: "#00ffcc", fillOpacity: 0.1, radius: 0
        });

        const anim = setInterval(() => {
            r += 7000;
            circle.setRadius(r);
            if (r > 600000) { clearInterval(anim); circle.setMap(null); }
        }, 100);
    }
</script>
</body>
</html>
