<!DOCTYPE html>
<html>
<head>
    <title>EARTHQUAKE VIEWER | OFFICIAL SOUND</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        #map { position: absolute; width: 100%; height: 100%; z-index: 1; background: #0b1621; }
        .leaflet-layer { filter: invert(1) hue-rotate(180deg) brightness(0.3) contrast(1.5); }

        #ui-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; pointer-events: none; border: 1px solid rgba(0, 255, 204, 0.3); }
        
        #top-bar { 
            background: rgba(0, 0, 0, 0.9); color: #00ffcc; padding: 12px 20px; 
            border-bottom: 2px solid #00ffcc; font-size: 14px; font-weight: bold;
            display: flex; justify-content: space-between; pointer-events: auto;
        }

        #audio-btn { 
            background: #00ffcc; color: black; border: none; padding: 5px 10px; 
            font-weight: bold; cursor: pointer; border-radius: 3px; 
        }

        /* Official Red Alert Box */
        #alert-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.95); color: white; padding: 30px;
            border: 4px solid white; text-align: center; display: none; z-index: 5000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
        }

        .epicenter-star { 
            color: #ff0000; font-size: 60px; text-shadow: 0 0 20px red; 
            position: absolute; transform: translate(-50%, -50%); 
            animation: pulse-star 0.4s infinite; 
        }
        @keyframes pulse-star { 0% { scale: 1; } 50% { scale: 1.4; } 100% { scale: 1; } }
    </style>
</head>
<body>

<div id="map"></div>
<div id="ui-frame">
    <div id="top-bar">
        <span>● PH-EEW MONITOR | HAZARD DATA</span>
        <button id="audio-btn" onclick="activateAudio()">ENABLE AUDIO</button>
    </div>
    <div id="alert-box">
        <div style="font-size: 32px; margin-bottom: 10px;">EARTHQUAKE ALERT</div>
        <div style="font-size: 18px;">STRONG SHAKING EXPECTED</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([12.879, 121.774], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let audioCtx;
    const TARGET_STA = "R716E";

    function activateAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('audio-btn').innerText = "AUDIO ONLINE";
        document.getElementById('audio-btn').style.background = "#555";
    }

    // --- PHIVOLCS-STYLE CHIME DESIGN ---
    function playOfficialChime() {
        if (!audioCtx) return;
        
        const playTone = (freq, startTime, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine'; // Pure tone
            osc.frequency.setValueAtTime(freq, startTime);
            
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.4, startTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        };

        // Official Rhythmic Pulse (Ding-Ding-Ding)
        const now = audioCtx.currentTime;
        playTone(960, now, 0.4);       // High note
        playTone(960, now + 0.5, 0.4); // High note
        playTone(960, now + 1.0, 0.4); // High note
    }

    async function streamData() {
        const proxy = "https://api.allorigins.win/raw?url=";
        const api = `https://data.raspberryshakedata.com/fdsnws/dataselect/1/query?net=AM&sta=${TARGET_STA}&loc=00&cha=SHZ&format=ascii&nodata=404`;
        
        try {
            const res = await fetch(proxy + encodeURIComponent(api));
            const data = await res.text();
            const val = parseFloat(data.trim().split('\n').pop());
            
            // Trigger check
            if(!isNaN(val) && Math.abs(val) > 4000) {
                triggerEEW(14.601, 121.033);
            }
        } catch (e) { }
        setTimeout(streamData, 1000);
    }

    let active = false;
    function triggerEEW(lat, lng) {
        if (active) return;
        active = true;

        document.getElementById('alert-box').style.display = 'block';
        playOfficialChime();

        const starIcon = L.divIcon({ html: "<div class='epicenter-star'>★</div>", className: '', iconSize: [0, 0] });
        const star = L.marker([lat, lng], {icon: starIcon}).addTo(map);
        
        const pWave = L.circle([lat, lng], { color: '#00ffcc', weight: 2, radius: 0 }).addTo(map);
        const sWave = L.circle([lat, lng], { color: '#ff0000', weight: 3, radius: 0 }).addTo(map);

        let pR = 0; let sR = 0;
        const expansion = setInterval(() => {
            pR += 6500; sR += 3400;
            pWave.setRadius(pR); sWave.setRadius(sR);
            if (pR > 700000) {
                map.removeLayer(pWave); map.removeLayer(sWave); map.removeLayer(star);
                document.getElementById('alert-box').style.display = 'none';
                active = false;
                clearInterval(expansion);
            }
        }, 100);
    }

    streamData();
</script>
</body>
</html>
