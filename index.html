<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitoring Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #333;
        }
        .main-container {
            display: flex;
            flex: 1;
            flex-direction: column;
        }
        .control-panel {
            background-color: #1a1a1a;
            margin: 15px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #292929;
            text-align: center;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .file-input {
            display: none;
        }
        .data-display {
            flex: 1;
            background-color: #1f1f1f;
            margin: 0 15px 15px 15px;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            overflow-y: auto;
            border: 1px solid #292929;
        }
    </style>
</head>
<body>

    <header>📡 STATION MONITORING INTERFACE</header>

    <div class="main-container">
        <div class="control-panel">
            <h2>Hardware & Data Access</h2>
            
            <button class="btn" onclick="requestMic()">🎙️ Enable Microphone</button>
            
            <button class="btn" onclick="document.getElementById('fileLoader').click()">📂 Load Station Logs</button>
            <input type="file" id="fileLoader" class="file-input" onchange="handleFile(this.files)">
        </div>

        <div class="data-display" id="logDisplay">
            [SYSTEM INFO] Web interface ready.<br>
        </div>
    </div>

    <script>
        function logMessage(text) {
            const display = document.getElementById('logDisplay');
            display.innerHTML += `[SYSTEM] ${text}<br>`;
            display.scrollTop = display.scrollHeight;
        }

        // 1. Request Microphone Access
        async function requestMic() {
            try {
                // This triggers the browser's built-in permission popup
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                logMessage("<span style='color: #00ff00;'>Microphone access GRANTED. Stream connected.</span>");
                
                // You can add your audio analysis processing logic here
                
            } catch (err) {
                logMessage("<span style='color: #ff3333;'>Microphone access DENIED: " + err.message + "</span>");
            }
        }

        // 2. Request and Read Local Files
        function handleFile(files) {
            if (files.length === 0) return;
            const file = files[0];
            logMessage(`Loading file: <strong>${file.name}</strong> (${file.size} bytes)`);

            const reader = new FileReader();
            reader.onload = function(e) {
                logMessage("<span style='color: #00ebff;'>File loaded successfully! Parsing data stream...</span>");
                // The contents of the file are available here at: e.target.result
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
